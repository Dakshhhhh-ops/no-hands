<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="VoiceArchitect is a voice-first workspace for reviewing architecture changes, diagrams, API contracts, risks, and engineering tasks." />

    <!-- Preconnect to Google Fonts so the typeface starts loading before JS parses -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts used by tokens.css: Instrument Sans (UI) + JetBrains Mono (code). font-display=swap keeps text visible. -->

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Non-critical CSS is injected by Vite; this is only the critical shell. -->
    <noscript>
      <style>
        body { background: #0b1220; }
      </style>
    </noscript>

    <title>VoiceArchitect — No-Hands Architecture Workspace</title>
  </head>

  </body>
</html>
