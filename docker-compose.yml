services:
  voicearchitect:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Abuse limits for /api/interpret; see docs/DEVELOPING.md "Deploy". Empty means the default.
      - VOICEARCHITECT_RATE_PER_MINUTE=${VOICEARCHITECT_RATE_PER_MINUTE:-}
      - VOICEARCHITECT_DAILY_CAP=${VOICEARCHITECT_DAILY_CAP:-}
      - VOICEARCHITECT_TIMEOUT_MS=${VOICEARCHITECT_TIMEOUT_MS:-}
      - VOICEARCHITECT_MAX_BODY_KB=${VOICEARCHITECT_MAX_BODY_KB:-}
      - VOICEARCHITECT_TRUST_PROXY=${VOICEARCHITECT_TRUST_PROXY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Development server with hot reload
  voicearchitect-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_HOST=0.0.0.0
    profiles:
      - dev