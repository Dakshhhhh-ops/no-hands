# Render Blueprint: one web service built from the Dockerfile. The image runs
# server/serve.ts, which serves the app and the /api routes, so a static host
# would not work.
#
# Keys are secrets (sync: false): Render asks for them when you create the
# service from this file, and they never live in the repo or the browser bundle.
# Set GROQ_API_KEY: Groq is the measured interpreter and the guided demo's
# recordings are Groq's. Leave ANTHROPIC_API_KEY empty until Claude has eval
# numbers, because the server uses Claude whenever that key is set. Leave both
# empty to run on recorded answers and the offline rules.
#
# Free plan: the service spins down after 15 minutes without traffic, and the
# next request waits about a minute while it starts again. Each workspace gets
# 750 free instance hours a month, enough for one service kept awake by
# .github/workflows/keep-warm.yml.
services:
  - type: web
    name: voicearchitect
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Seals the Wispr Flow sign-in into an encrypted cookie, so it survives the free
      # plan's restarts. Render generates a random value once; keep it, because a new
      # value signs everyone out.
      - key: WISPR_SESSION_SECRET
        generateValue: true
      # Render sits behind a proxy, so rate limits must read the client address
      # from X-Forwarded-For.
      - key: VOICEARCHITECT_TRUST_PROXY
        value: "1"
      # The port server/serve.ts listens on inside the image.
      - key: PORT
        value: "8080"
